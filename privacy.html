      <h1>Privacy — NeatCV</h1>
      <p>
        Your resume, imported files, photo and PDF are processed in your
        browser. NeatCV does not upload your resume. Browser storage keeps the
        local copy; clearing site data removes it, so keep a backup.
      </p>
      <p>
        Source labels from ?ref= links are stored locally for 30 days. Optional
        Umami analytics requires a configured website ID; without JavaScript no
        analytics runs on this page. Sentry error reporting is optional and
        requires a valid DSN; without JavaScript it does not run here.
        GitHub Pages hosts this site and logs visitor IP addresses for security.
      </p>
      <p>
        Editable PDF and JSON backups contain every language version; use a
        sharing PDF when sending your resume to others. Privacy questions:
        <a href="https://www.linkedin.com/in/mrnednick/"
          >Nikita Nedyalkov on LinkedIn</a
        >.
      </p>
      <a href="/">Back to NeatCV</a>
    </noscript>
